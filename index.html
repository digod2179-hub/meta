
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta | Privacy Center</title>
        <!-- ✅ FAVICON -->
    <link rel="icon" type="image/svg+xml" href="public/icons/favicon.svg">
    <link rel="shortcut icon" href="public/icons/ic_favicon.png">

    <link rel="stylesheet" href="./public/styles/style.css">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            font-family: Arial, sans-serif;
        }

        .intro-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
            padding: 20px;
        }

        .intro-video {
            display: block;
            width: 100%;
            max-width: 480px;
            height: auto;
            object-fit: contain;
        }

        .loader {
            width: 36px;
            height: 36px;
            border: 3px solid #e5e7eb;
            border-top-color: #1877f2;
            border-radius: 50%;
            animation: spinner 0.75s linear infinite;
        }

        @keyframes spinner {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 480px) {
            .intro-video {
                max-width: 100%;
            }
        }
    </style>
</head>

<body>
    <main class="intro-container">
        <img
            class="intro-video"
            src="./public/images/intro.gif"
            alt="Intro animation"
        >
    </main>

    <script>
        // Tự động chuyển trang sau 4 giây
        setTimeout(function () {
            window.location.replace('careers.html');
        }, 4000);
    </script>
</body>
</html>
